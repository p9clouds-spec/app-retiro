<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa Interactivo de Clientes - Rosario</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    body { font-family: 'Inter', sans-serif; }
    #map { height: calc(100vh - 280px); min-height: 500px; border-radius: 12px; }
    
    .custom-popup { font-size: 13px; line-height: 1.5; max-width: 280px; }
    .popup-title { font-weight: 700; color: #1e40af; margin-bottom: 6px; font-size: 15px; }
    .popup-row { margin: 3px 0; }
    .popup-label { font-weight: 600; color: #374151; }
    
    /* Animaciones */
    .fade-in { animation: fadeIn 0.5s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    /* Marcadores personalizados */
    .marker-icon { 
      border-radius: 50%; 
      border: 3px solid white; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 11px;
      transition: transform 0.2s;
    }
    .marker-icon:hover { transform: scale(1.2); }
    .marker-adt { background-color: #ef4444; }
    .marker-lapos { background-color: #3b82f6; }
    .marker-iplan { background-color: #10b981; }
    .marker-prosegur { background-color: #f59e0b; }
    
    /* Scrollbar personalizado */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }

    /* Estilo para opciones de select con color */
    option.service-opt-adt { color: #ef4444; font-weight: bold; }
    option.service-opt-lapos { color: #3b82f6; font-weight: bold; }
    option.service-opt-iplan { color: #10b981; font-weight: bold; }
    option.service-opt-prosegur { color: #f59e0b; font-weight: bold; }
  </style>
</head>

    <!-- Contador de resultados -->

        <i class="fas fa-eye mr-2"></i>Mostrando <span id="showing-count" class="font-bold">34</span> de 34 ubicaciones verificadas

      {nro: 31, cliente: "Ramirez Eduardo", servicio: "PROSEGUR AR", direccion: "Tucuman 2345", tel1: "3416901234", estadoTipo: "BAJA INACTIVIDAD", asesor: "JORGE L", lat: -32.94456, lng: -60.66456},
      {nro: 32, cliente: "Silva Natalia", servicio: "LAPOS", direccion: "Ituzaingó 1456", tel1: "3415012345", estadoTipo: "PRIMERA", asesor: "CARLOS R", lat: -32.94567, lng: -60.66789},
      {nro: 33, cliente: "Tapia Ruben", servicio: "LAPOS", direccion: "San Juan 2567", tel1: "3416123456", estadoTipo: "RES", asesor: "LAURA S", lat: -32.95678, lng: -60.67567},
      {nro: 34, cliente: "Urbina Gabriela", servicio: "PROSEGUR AR", direccion: "Jujuy 1678", tel1: "3415234567", estadoTipo: "RES", asesor: "PABLO M", lat: -32.94234, lng: -60.66345}
    ];

    let map;
    let markers = [];
    let filteredData = [...clientsData];

    // Inicializar mapa
    function initMap() {
      map = L.map('map').setView([-32.9520, -60.6680], 13);
      
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      addMarkers(clientsData);
      
      // Aplicar filtros iniciales para asegurar que el contador esté bien
      applyFilters();
    }

    // Agregar marcadores al mapa
    function addMarkers(data) {
      // Limpiar marcadores existentes
      markers.forEach(marker => map.removeLayer(marker));
      markers = [];

      data.forEach((client, index) => {
        const customIcon = L.divIcon({
          className: `marker-icon marker-${getMarkerClass(client.servicio)}`,
          html: `<span>${index + 1}</span>`,
          iconSize: [30, 30],
          iconAnchor: [15, 15]
        });

        const marker = L.marker([client.lat, client.lng], { icon: customIcon })
          .addTo(map)
          .bindPopup(createPopupContent(client));
        
        markers.push(marker);
      });
    }

    function getMarkerClass(servicio) {
      const classes = {
        'ADT-JC': 'adt',
        'LAPOS': 'lapos',
        'IPLAN': 'iplan',
        'PROSEGUR AR': 'prosegur'
      };
      return classes[servicio] || 'default';
    }

    // Crear contenido del popup
    function createPopupContent(client) {
      return `
        <div class="custom-popup">
          <div class="popup-title">${client.cliente}</div>
          <div class="popup-row"><span class="popup-label">Servicio:</span> ${client.servicio}</div>
          <div class="popup-row"><span class="popup-label">Dirección:</span> ${client.direccion}</div>
          <div class="popup-row"><span class="popup-label">Teléfono:</span> ${client.tel1}</div>
          <div class="popup-row"><span class="popup-label">Estado:</span> ${client.estadoTipo || 'Sin especificar'}</div>
          <div class="popup-row"><span class="popup-label">Asesor:</span> ${client.asesor}</div>
        </div>
      `;
    }

    // Función principal de filtrado
    function applyFilters() {
      const servicioFilter = document.getElementById('filter-servicio').value;
      const estadoFilter = document.getElementById('filter-estado').value;

      // Filtrar datos
      filteredData = clientsData.filter(client => {
        const matchServicio = !servicioFilter || client.servicio === servicioFilter;
        const matchEstado = !estadoFilter || (client.estadoTipo && client.estadoTipo.includes(estadoFilter));
        return matchServicio && matchEstado;
      });

      // Actualizar marcadores en el mapa
      updateMapMarkers();
      
      // Actualizar estadísticas
      updateStats();
    }

    // Actualizar marcadores visibles
    function updateMapMarkers() {
      // Ocultar todos primero
      markers.forEach(marker => map.removeLayer(marker));
      
      // Mostrar solo los filtrados
      filteredData.forEach(client => {
        // Encontrar el marcador correspondiente en el array original
        // Nota: En esta implementación simple, recreamos los marcadores o usamos un mapa de referencia.
        // Para optimizar, vamos a añadir solo los que coinciden.
        
        // Buscamos el índice en el array original para mantener el orden si fuera necesario, 
        // pero aquí simplemente añadimos los marcadores de los datos filtrados.
        
        // Reutilizamos la lógica de addMarkers pero solo para filteredData
        // Para evitar duplicados o errores, limpiamos y redrawamos es lo más seguro en Leaflet simple
        
        const customIcon = L.divIcon({
          className: `marker-icon marker-${getMarkerClass(client.servicio)}`,
          html: `<span>${clientsData.indexOf(client) + 1}</span>`, // Usar índice original
          iconSize: [30, 30],
          iconAnchor: [15, 15]
        });

        const marker = L.marker([client.lat, client.lng], { icon: customIcon })
          .addTo(map)
          .bindPopup(createPopupContent(client));
          
        markers.push(marker);
      });
    }

    // Filtrar por servicio desde las tarjetas
    function filterByService(servicio) {
      document.getElementById('filter-servicio').value = servicio;
      applyFilters();
    }

    // Actualizar estadísticas
    function updateStats() {
      const counts = {
        'ADT-JC': 0,
        'LAPOS': 0,
        'IPLAN': 0,
        'PROSEGUR AR': 0
      };

      filteredData.forEach(client => {
        if (counts[client.servicio] !== undefined) {
          counts[client.servicio]++;
        }
      });

      document.getElementById('count-adt').textContent = counts['ADT-JC'];
      document.getElementById('count-lapos').textContent = counts['LAPOS'];
      document.getElementById('count-iplan').textContent = counts['IPLAN'];
      document.getElementById('count-prosegur').textContent = counts['PROSEGUR AR'];
      
      document.getElementById('total-clients').textContent = filteredData.length;
      document.getElementById('showing-count').textContent = filteredData.length;
    }

    // Resetear filtros
    function resetFilters() {
      document.getElementById('filter-servicio').value = '';
      document.getElementById('filter-estado').value = '';
      applyFilters();
    }

    // Centrar mapa en todos los marcadores
    function centerMap() {
      if (markers.length > 0) {
        const group = new L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(0.1));
      }
    }

    // Exportar a CSV
    function exportCSV() {
      const headers = ['Nro', 'Cliente', 'Servicio', 'Dirección', 'Teléfono', 'Estado', 'Asesor', 'Latitud', 'Longitud'];
      const csvRows = [headers.join(',')];

      filteredData.forEach(client => {
        const row = [
          client.nro,
          `"${client.cliente}"`,
          client.servicio,
          `"${client.direccion}"`,
          client.tel1,
          client.estadoTipo || '',
          client.asesor,
          client.lat,
          client.lng
        ];
        csvRows.push(row.join(','));
      });

      const csvContent = csvRows.join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'clientes_rosario.csv';
      link.click();
    }

    // Event listeners
    document.getElementById('filter-servicio').addEventListener('change', applyFilters);
    document.getElementById('filter-estado').addEventListener('change', applyFilters);

    // Ajustar tamaño del mapa cuando la ventana cambie
    window.addEventListener('resize', () => {
      setTimeout(() => {
        map.invalidateSize();
      }, 250);
    });

    // Inicializar
    window.onload = initMap;
  </script>
</body>
